name: fluxer
title: Fluxer
base: core24
summary: Open source instant messaging and VoIP for communities and friends
description: |
  Fluxer is a free and open source instant messaging and voice chat
  platform. Use the desktop app to talk with friends and communities through
  text channels, direct messages, and voice and video calls, with screen
  sharing and desktop notifications.

  This snap repackages the official Fluxer desktop .deb from pkgs.fluxer.com.
  It is an unofficial community package and is not affiliated with or
  endorsed by the Fluxer developers.

  Packaging source and issue tracker: https://github.com/phqen1x/fluxer-snap
license: AGPL-3.0-or-later
website: https://fluxer.com/
source-code: https://github.com/phqen1x/fluxer-snap
issues: https://github.com/phqen1x/fluxer-snap/issues
contact: https://github.com/phqen1x/fluxer-snap/issues
adopt-info: fluxer
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

parts:
  fluxer:
    plugin: dump
    source:
      - on amd64: https://pkgs.fluxer.com/deb/pool/main/f/fluxer/fluxer_2026.1114.60222_amd64.deb
      - on arm64: https://pkgs.fluxer.com/deb/pool/main/f/fluxer/fluxer_2026.1114.60222_arm64.deb
    source-type: deb
    source-checksum:
      - on amd64: sha256/2c2ae12fff2f1569a7c897e2b90ac2f961b901052c8eeaebfb05e90cd4c82b2b
      - on arm64: sha256/a29402604bb8d2e1284a9bb8fa29dc1820f8c0d4b4a294f01cda842c223016a1
    stage-packages:
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - xdg-utils
      - libatspi2.0-0t64
      - libsecret-1-0
      - libpulse0
      - libpipewire-0.3-0t64
      - libappindicator3-1
    override-build: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PART_INSTALL/opt/Fluxer/version")"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/1024x1024/apps/fluxer.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/app.fluxer.FluxerDesktop.desktop"
      # The setuid helper cannot work in a snap; Electron runs with --no-sandbox
      rm -f "$CRAFT_PART_INSTALL/opt/Fluxer/chrome-sandbox"

lint:
  ignore:
    - library:
      - opt/Fluxer/**

apps:
  fluxer:
    command: opt/Fluxer/fluxer --no-sandbox
    autostart: app.fluxer.FluxerDesktop.desktop
    extensions: [gnome]
    desktop: usr/share/applications/app.fluxer.FluxerDesktop.desktop
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - audio-playback
      - audio-record
      - browser-support
      - camera
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - screen-inhibit-control
      - unity7
      - wayland
      - x11
