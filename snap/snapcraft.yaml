name: fluxer
title: Fluxer
base: core24
summary: Instant messaging and VoIP
description: |
  Fluxer is an instant messaging and VoIP desktop application.

  This snap repackages the official Fluxer .deb from pkgs.fluxer.com.
license: AGPL-3.0-or-later
website: https://fluxer.app
adopt-info: fluxer
grade: devel
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

parts:
  fluxer:
    plugin: dump
    source:
      - on amd64: https://pkgs.fluxer.com/deb/pool/main/f/fluxer/fluxer_2026.1105.25408_amd64.deb
      - on arm64: https://pkgs.fluxer.com/deb/pool/main/f/fluxer/fluxer_2026.1105.25408_arm64.deb
    source-type: deb
    source-checksum:
      - on amd64: sha256/e97236a925c42325de646714b3fec5bee9a0ff112454e109c80a10c3c84b5931
      - on arm64: sha256/246b61f10393b9d8ffa053ff8ce63f53750d23d27ea7f388e850dc6143b1bb90
    stage-packages:
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - xdg-utils
      - libatspi2.0-0t64
      - libsecret-1-0
      - libpulse0
      - libpipewire-0.3-0t64
      - libappindicator3-1
    override-build: |
      craftctl default
      craftctl set version="$(cat "$CRAFT_PART_INSTALL/opt/Fluxer/version")"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/1024x1024/apps/fluxer.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/app.fluxer.FluxerDesktop.desktop"
      # The setuid helper cannot work in a snap; Electron runs with --no-sandbox
      rm -f "$CRAFT_PART_INSTALL/opt/Fluxer/chrome-sandbox"

lint:
  ignore:
    - library:
      - opt/Fluxer/**

apps:
  fluxer:
    command: opt/Fluxer/fluxer --no-sandbox
    extensions: [gnome]
    desktop: usr/share/applications/app.fluxer.FluxerDesktop.desktop
    environment:
      TMPDIR: $XDG_RUNTIME_DIR
    plugs:
      - audio-playback
      - audio-record
      - browser-support
      - camera
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - screen-inhibit-control
      - unity7
      - wayland
      - x11
